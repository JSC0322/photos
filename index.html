<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>檔案庫導航</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background: #fafafa; color: #333; line-height: 1.6; }
    header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
    h2 { margin: 0 0 10px 0; }
    .btn { background: #0066cc; color: #fff; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 14px; }
    .btn:hover { background: #0052a3; }
    
    /* 清單排版 */
    ul { list-style-type: none; padding: 0; margin: 0; }
    li { background: #fff; border: 1px solid #e0e0e0; margin-bottom: 8px; border-radius: 6px; }
    li a, li .cat-title { display: block; padding: 12px 16px; color: #0066cc; text-decoration: none; font-weight: 500; }
    li a:hover { background: #f0f7ff; border-radius: 6px; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h2 id="title">商品分類導航</h2>
    <button id="back-btn" class="btn hidden" onclick="showCategories()">← 返回分類列表</button>
  </header>

  <!-- 首頁：分類列表 -->
  <ul id="category-list">
    <li>
      <a href="#" onclick="showGallery('cat1'); return false;">📂 系列 A - 經典商品 (PDF / 圖片)</a>
    </li>
    <li>
      <a href="#" onclick="showGallery('cat2'); return false;">📂 系列 B - 季節限定</a>
    </li>
  </ul>

  <!-- 分類 1 的檔案清單 -->
  <ul id="cat1" class="hidden gallery-group">
    <li>
      <a href="homework/cat1/01.pdf" target="_blank">📄 01.pdf - 產品規格書 (點擊開啟)</a>
    </li>
    <li>
      <a href="homework/cat1/02.jpg" target="_blank">🖼️ 02.jpg - 商品高清圖 (點擊開啟)</a>
    </li>
  </ul>

  <!-- 分類 2 的檔案清單 -->
  <ul id="cat2" class="hidden gallery-group">
    <li>
      <a href="homework/cat2/01.pdf" target="_blank">📄 01.pdf - 季節目錄 (點擊開啟)</a>
    </li>
  </ul>

  <script>
    function showGallery(catId) {
      document.getElementById('category-list').classList.add('hidden');
      
      const galleries = document.querySelectorAll('.gallery-group');
      galleries.forEach(el => el.classList.add('hidden'));
      document.getElementById(catId).classList.remove('hidden');

      document.getElementById('back-btn').classList.remove('hidden');
      document.getElementById('title').innerText = '檔案清單';
    }

    function showCategories() {
      document.getElementById('category-list').classList.remove('hidden');

      const galleries = document.querySelectorAll('.gallery-group');
      galleries.forEach(el => el.classList.add('hidden'));

      document.getElementById('back-btn').classList.add('hidden');
      document.getElementById('title').innerText = '商品分類導航';
    }
  </script>
</body>
</html>
