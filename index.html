<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品圖庫導航</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #fafafa; color: #333; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-underline-offset: 3px; text-decoration: underline; }
    
    /* 導航標頭 */
    header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
    .btn { background: #e0e0e0; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
    
    /* 網格排列 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    
    /* 外觀卡片 */
    .item { border: 1px solid #ddd; background: #fff; padding: 10px; border-radius: 6px; text-align: center; }
    .item img { width: 100%; height: 150px; object-fit: cover; background: #eee; display: block; margin-bottom: 8px; }
    
    /* 隱藏區塊 */
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h2 id="title">商品分類導航</h2>
    <button id="back-btn" class="btn hidden" onclick="showCategories()">← 返回分類列表</button>
  </header>

  <!-- 分類列表區塊 -->
  <div id="category-list" class="grid">
    
    <!-- 分類 1 -->
    <div class="item" onclick="showGallery('cat1')" style="cursor:pointer;">
      <img src="homework/cat1/01.jpg" alt="分類A" onerror="this.src='https://via.placeholder.com/200x150?text=No+Cover'">
      <strong>系列 A - 經典冰品</strong>
    </div>

    <!-- 分類 2 -->
    <div class="item" onclick="showGallery('cat2')" style="cursor:pointer;">
      <img src="homework/cat2/01.jpg" alt="分類B" onerror="this.src='https://via.placeholder.com/200x150?text=No+Cover'">
      <strong>系列 B - 季節限定</strong>
    </div>

  </div>

  <!-- 分類 1 的圖片區塊 -->
  <div id="cat1" class="grid hidden gallery-group">
    <div class="item">
      <a href="homework/cat1/01.jpg" target="_blank">
        <img src="homework/cat1/01.jpg" alt="圖片 1">
        <span>01.jpg (開啟原圖)</span>
      </a>
    </div>
    <div class="item">
      <a href="homework/cat1/02.jpg" target="_blank">
        <img src="homework/cat1/02.jpg" alt="圖片 2">
        <span>02.jpg (開啟原圖)</span>
      </a>
    </div>
  </div>

  <!-- 分類 2 的圖片區塊 -->
  <div id="cat2" class="grid hidden gallery-group">
    <div class="item">
      <a href="homework/cat2/01.jpg" target="_blank">
        <img src="homework/cat2/01.jpg" alt="圖片 1">
        <span>01.jpg (開啟原圖)</span>
      </a>
    </div>
  </div>

  <script>
    function showGallery(catId) {
      // 隱藏首頁分類
      document.getElementById('category-list').classList.add('hidden');
      
      // 隱藏所有圖庫，只顯示點擊的那一個
      const galleries = document.querySelectorAll('.gallery-group');
      galleries.forEach(el => el.classList.add('hidden'));
      document.getElementById(catId).classList.remove('hidden');

      // 顯示返回按鈕
      document.getElementById('back-btn').classList.remove('hidden');
      document.getElementById('title').innerText = '圖片導航';
    }

    function showCategories() {
      // 顯示首頁分類
      document.getElementById('category-list').classList.remove('hidden');

      // 隱藏所有圖庫區塊
      const galleries = document.querySelectorAll('.gallery-group');
      galleries.forEach(el => el.classList.add('hidden'));

      // 隱藏返回按鈕
      document.getElementById('back-btn').classList.add('hidden');
      document.getElementById('title').innerText = '商品分類導航';
    }
  </script>
</body>
</html>
